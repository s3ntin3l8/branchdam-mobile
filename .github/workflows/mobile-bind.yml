name: mobile-bind

# Optional workflow that builds the gomobile-bound branchdam library and
# uploads the artifacts (AAR + xcframework) for the commit. Not a required
# check; opt in by adding the `mobile-bind` label to a PR.
#
# Why: producing the iOS xcframework requires macOS, and the AAR build needs
# the Android NDK. These are not part of the standard `make check` flow, but
# are useful to validate on demand.

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mobile-bind-android:
    name: Android AAR
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'mobile-bind')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;25.1.8937393'

      - name: Build branchdam.aar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
        run: ./scripts/build-mobile.sh --android-only

      - name: Upload AAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branchdam-aar
          path: android/app/libs/branchdam.aar
          if-no-files-found: error

  mobile-bind-ios:
    name: iOS xcframework
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'mobile-bind')
    runs-on: macos-14
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build BranchDam.xcframework
        run: ./scripts/build-mobile.sh --ios-only

      - name: Upload xcframework
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branchdam-xcframework
          path: ios/Frameworks/branchdam.xcframework
          if-no-files-found: error
