name: Hermes (review)

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  # `auto-review` deliberately excludes `mullion/task-*` branches (see the
  # job's own `if:` below) -- Task Master's own review agent is the terminal
  # review for its tasks (s3ntin3l8/mullion-session-manager#1003, ported
  # from that repo's #998). `on-demand-review` is NOT excluded -- a human
  # can still explicitly ask for a second opinion via
  # `@s3ntin3l8-hermes Review`.
  auto-review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 's3ntin3l8-hermes[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.draft == false &&
      !startsWith(github.event.pull_request.head.ref, 'mullion/task-')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write
    uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@main
    with:
      mode: auto
      mention-trigger: s3ntin3l8-hermes
    secrets: inherit # pragma: allowlist secret

  on-demand-review:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor != 's3ntin3l8-hermes[bot]' &&
      contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write
    uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@main
    with:
      mention-trigger: s3ntin3l8-hermes
    secrets: inherit # pragma: allowlist secret
