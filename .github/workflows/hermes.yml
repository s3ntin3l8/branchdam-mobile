name: Hermes (review)

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  # `auto-review` deliberately excludes `mullion/task-*` branches (see the
  # job's own `if:` below) -- Task Master's own review agent is the terminal
  # review for its tasks (s3ntin3l8/mullion-session-manager#1003, ported
  # from that repo's #998). `on-demand-review` is NOT excluded -- a human
  # can still explicitly ask for a second opinion via
  # `@s3ntin3l8-hermes Review`.
  auto-review:
    # The fork guard (head.repo.full_name != github.repository -> skip) is enforced
    # inside the reusable workflow itself (s3ntin3l8/.github#53) as defense-in-depth;
    # callers don't need their own copy.
    #
    # NOTE: excluding by PR *author* (github.event.pull_request.user.login),
    # not github.actor -- on `ready_for_review`, github.actor is whoever
    # clicked "Ready for review", which is not necessarily who opened the
    # PR. Author-based exclusion keeps working on both trigger types.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 's3ntin3l8-hermes[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.draft == false &&
      !startsWith(github.event.pull_request.head.ref, 'mullion/task-')
    permissions:
      contents: read # all gh calls in the callee use the Hermes App token
    uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@8957219ed8c28f90559cff917853542102011458 # main @ 2026-10-25
    with:
      mode: auto
      mention-trigger: s3ntin3l8-hermes
      # Dispatch through Hermes' Runs API and poll the run to a terminal
      # status: the check goes red when the review fails, instead of turning
      # green the moment the request is accepted (which is how a saturated
      # gateway used to read as "relayed"). The polling job holds its runner
      # for the length of the review (minutes). The Runs path also reacts
      # with an eye to the pull request and to the comment that asked for the
      # review, so a request is visibly picked up.
      hermes-use-runs: true
    secrets:
      HERMES_APP_ID: ${{ secrets.HERMES_APP_ID }}
      HERMES_APP_PRIVATE_KEY: ${{ secrets.HERMES_APP_PRIVATE_KEY }}
      HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}

  on-demand-review:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor != 's3ntin3l8-hermes[bot]' &&
      contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: read # all gh calls in the callee use the Hermes App token
    uses: s3ntin3l8/.github/.github/workflows/hermes-review.yml@8957219ed8c28f90559cff917853542102011458 # main @ 2026-10-25
    with:
      mention-trigger: s3ntin3l8-hermes
      # See the auto-review job above: poll the run instead of firing and
      # forgetting, so a review that failed is a red check rather than a
      # silent no-op.
      hermes-use-runs: true
    secrets:
      HERMES_APP_ID: ${{ secrets.HERMES_APP_ID }}
      HERMES_APP_PRIVATE_KEY: ${{ secrets.HERMES_APP_PRIVATE_KEY }}
      HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
