name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-core:
    name: Core (Go build · vet · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Test core/ packages with coverage
        run: |
          cd core
          go test -race -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Test branchdam public package
        run: |
          go test -race -v .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/coverage.txt
          flags: core
          fail_ci_if_error: false

  lint:
    name: Pre-commit & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod

      - name: Pre-commit
        uses: pre-commit/action@v3.0.1

  test-ios:
    name: iOS (Build & Test)
    runs-on: macos-14
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v7

      # Pin the Xcode version explicitly. The default Xcode that ships
      # with the macos-14 image can change, and the iPhone 16 simulator
      # isn't guaranteed to be present in every future release. Xcode
      # 15.4 is the version this project has been validated against.
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build Go Core xcframework
        run: |
          ./scripts/build-mobile.sh --ios-only

      - name: Run iOS Unit Tests
        run: |
          xcodebuild test \
            -project ios/BranchDamApp.xcodeproj \
            -scheme BranchDamApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  test-android:
    name: Android (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;25.1.8937393'

      - name: Build Go Core AAR
        # ANDROID_HOME is exported by setup-android into $GITHUB_ENV; ANDROID_NDK_HOME
        # follows the standard layout ($ANDROID_HOME/ndk/<version>).
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
        run: |
          ./scripts/build-mobile.sh --android-only

      - name: Run Android Unit Tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew test

      - name: Verify 16KB ELF alignment of bundled .so files
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
        run: |
          set -euo pipefail
          AAR="${{ github.workspace }}/android/app/libs/branchdam.aar"
          if [[ ! -f "$AAR" ]]; then
            echo "::error::AAR not found at $AAR — did the gomobile build step run?"
            exit 1
          fi
          rm -rf aar-extract
          mkdir aar-extract
          unzip -o -q "$AAR" -d aar-extract
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          if [[ ! -x "$READELF" ]]; then
            echo "::error::llvm-readelf not found at $READELF"
            exit 1
          fi
          fail=0
          for so in aar-extract/jni/*/*.so; do
            [[ -f "$so" ]] || continue
            echo "Checking $so ..."
            # -lW = program headers, wide output. LOAD lines have an "Align"
            # column in hex (e.g. "0x4000"). 16KB = 0x4000.
            mapfile -t lines < <("$READELF" -lW "$so" | awk '/^[[:space:]]*LOAD/')
            for line in "${lines[@]}"; do
              align=$(echo "$line" | awk '{print $NF}')
              if [[ ! "$align" =~ ^0x[0-9a-fA-F]+$ ]]; then
                echo "::error file=$so::could not parse Align from: $line"
                fail=1
                continue
              fi
              align_dec=$((align))
              if (( align_dec < 0x4000 )); then
                echo "::error file=$so::LOAD segment not 16KB-aligned (align=$align): $line"
                fail=1
              fi
            done
          done
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::One or more .so files have non-16KB-aligned PT_LOAD segments."
            exit 1
          fi
          echo "All .so files have 16KB-aligned PT_LOAD segments."
