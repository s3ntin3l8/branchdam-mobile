name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-core:
    name: Core (Go build · vet · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Test core/ packages with coverage
        run: |
          cd core
          go test -race -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Test branchdam public package
        run: |
          go test -race -v .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/coverage.txt
          flags: core
          fail_ci_if_error: false

  lint:
    name: Pre-commit & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod

      - name: Pre-commit
        uses: pre-commit/action@v3.0.1

  test-ios:
    name: iOS (Build & Test)
    runs-on: macos-14
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build Go Core xcframework
        run: |
          ./scripts/build-mobile.sh --ios-only

      - name: Run iOS Unit Tests
        run: |
          xcodebuild test \
            -project ios/BranchDamApp.xcodeproj \
            -scheme BranchDamApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  test-android:
    name: Android (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.2.11399342'

      - name: Build Go Core AAR
        # ANDROID_HOME is exported by setup-android into $GITHUB_ENV; ANDROID_NDK_HOME
        # follows the standard layout ($ANDROID_HOME/ndk/<version>).
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.2.11399342
        run: |
          ./scripts/build-mobile.sh --android-only

      - name: Run Android Unit Tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew test
