name: Release Please & Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Release tag to attach binaries to (leave empty for build-only test)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Falls back to the default GITHUB_TOKEN (today's behavior) until
          # RELEASE_PLEASE_TOKEN is added as a repo secret. PRs opened with
          # GITHUB_TOKEN don't trigger pull_request-triggered workflows, so
          # the release PR's required status checks (Core, Pre-commit & Lint,
          # CodeQL, dependency-review) never report — see issue #100. Set
          # RELEASE_PLEASE_TOKEN to a PAT or GitHub App installation token
          # scoped to contents:write + pull-requests:write to fix that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build-release-apk-aab:
    name: Build Release APK & AAB
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;25.1.8937393'

      - name: Build branchdam.aar
        # EngineHolder.kt and friends bind against the gomobile-generated
        # Branchdam class in this AAR; without it, compileReleaseKotlin fails
        # with "Unresolved reference 'Branchdam'". This job never built it —
        # see #104. Uses the same script as mobile-bind.yml's Android job so
        # the gomobile invocation isn't duplicated; built here rather than
        # downloaded from that workflow's artifact because both trigger off
        # the same push and there's no ordering guarantee between them.
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
        run: ./scripts/build-mobile.sh --android-only

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.release-tag }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding repository release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > ~/.android/release.keystore
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set in repository secrets; using self-signed development keystore for sideloading."
            if [ ! -f ~/.android/debug.keystore ]; then
              keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Release APK and App Bundle
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ needs.release-please.outputs.tag_name || inputs.release-tag || '0.2.0' }}
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '/home/runner/.android/release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # This pinned Gradle version joins any 2+ trailing CLI arguments
          # into one string before task resolution (verified empirically,
          # independent of the checked-in gradlew/gradle-wrapper.jar, which
          # pass args through unmodified) — invoke one task per call. See #99.
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Collect and Package Artifacts
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" dist/branchdam-mobile.apk
          fi
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" dist/branchdam-mobile.aab
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: branchdam-mobile-release-binaries
          path: dist/*
          if-no-files-found: warn

      - name: Attach Binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.release-tag }}
        run: |
          if [ -n "$TAG_NAME" ] && [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            echo "Uploading artifacts to release $TAG_NAME..."
            gh release upload "$TAG_NAME" dist/* --clobber -R "${{ github.repository }}"
          else
            echo "No release tag target specified or no artifacts found; skipping release attachment."
          fi
