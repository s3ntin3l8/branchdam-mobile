name: Release Please & Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Release tag to attach binaries to (leave empty for build-only test)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release-apk-aab:
    name: Build Release APK & AAB
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate self-signed debug keystore for installable sideloading
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK and App Bundle
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            gradle assembleRelease bundleRelease --no-daemon
          fi

      - name: Collect and Package Artifacts
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" dist/branchdam-mobile.apk
          fi
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" dist/branchdam-mobile.aab
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: branchdam-mobile-release-binaries
          path: dist/*
          if-no-files-found: warn

      - name: Attach Binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.release-tag }}
        run: |
          if [ -n "$TAG_NAME" ] && [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            echo "Uploading artifacts to release $TAG_NAME..."
            gh release upload "$TAG_NAME" dist/* --clobber -R "${{ github.repository }}"
          else
            echo "No release tag target specified or no artifacts found; skipping release attachment."
          fi
