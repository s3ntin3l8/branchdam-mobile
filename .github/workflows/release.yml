name: Release Please & Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Release tag to attach binaries to (leave empty for build-only test)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Falls back to the default GITHUB_TOKEN (today's behavior) until
          # RELEASE_PLEASE_TOKEN is added as a repo secret. PRs opened with
          # GITHUB_TOKEN don't trigger pull_request-triggered workflows, so
          # the release PR's required status checks (Core, Pre-commit & Lint,
          # CodeQL, dependency-review) never report — see issue #100. Set
          # RELEASE_PLEASE_TOKEN to a PAT or GitHub App installation token
          # scoped to contents:write + pull-requests:write to fix that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build-release-apk-aab:
    name: Build Release APK & AAB
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;25.1.8937393'

      - name: Build branchdam.aar
        # EngineHolder.kt and friends bind against the gomobile-generated
        # Branchdam class in this AAR; without it, compileReleaseKotlin fails
        # with "Unresolved reference 'Branchdam'". This job never built it —
        # see #104. Uses the same script as mobile-bind.yml's Android job so
        # the gomobile invocation isn't duplicated; built here rather than
        # downloaded from that workflow's artifact because both trigger off
        # the same push and there's no ordering guarantee between them.
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
        run: ./scripts/build-mobile.sh --android-only

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Configure Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.release-tag }}
        run: |
          mkdir -p ~/.android
          # A release build MUST be signed with this project's own keystore.
          # The Android debug keystore is not an acceptable substitute: its
          # credentials (android / androiddebugkey) ship in the Android SDK
          # and in every tutorial, and Android's upgrade check compares
          # signing CERTIFICATES rather than keys -- so an APK signed with the
          # debug key can be replaced by any third party and still be
          # accepted as an in-place upgrade of this app. Fail the release
          # instead of publishing such an artifact.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set in repository secrets; refusing to publish a release signed with the public Android debug key."
            exit 1
          fi
          for var in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set in repository secrets; refusing to publish a release signed with the public Android debug key."
              exit 1
            fi
          done
          echo "Decoding repository release keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > ~/.android/release.keystore

      - name: Build Release APK and App Bundle
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ needs.release-please.outputs.tag_name || inputs.release-tag || '0.2.0' }}
          KEYSTORE_FILE: /home/runner/.android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # This pinned Gradle version joins any 2+ trailing CLI arguments
          # into one string before task resolution (verified empirically,
          # independent of the checked-in gradlew/gradle-wrapper.jar, which
          # pass args through unmodified) — invoke one task per call. See #99.
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Collect and Package Artifacts
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.release-tag }}
        run: |
          mkdir -p dist
          # Strip the leading 'v' so v0.5.1 → 0.5.1, matching how the
          # version is recorded in the APK / AAB manifest (Gradle does the
          # same via appVersionName.removePrefix("v")).
          VER="${TAG_NAME#v}"
          if [ -z "$VER" ]; then VER="0.0.0"; fi

          APK_PATH=$(find android/app/build/outputs/apk/release -name "*-release.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "dist/branchdam-mobile-${VER}.apk"
          fi
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" "dist/branchdam-mobile-${VER}.aab"
          fi

          # SHA256 sidecar for sideload verification. List the files
          # explicitly so a stale `.sha256` from a re-run of this job is
          # not hashed into itself.
          if [ -f "dist/branchdam-mobile-${VER}.apk" ] || [ -f "dist/branchdam-mobile-${VER}.aab" ]; then
            ( cd dist && sha256sum \
                "branchdam-mobile-${VER}.apk" \
                "branchdam-mobile-${VER}.aab" \
              2>/dev/null > "branchdam-mobile-${VER}.sha256" )
          fi

          # Plain-text size + filename manifest for sideloaders / mirrors.
          # ls -l emits "<modes> <links> <owner> <group> <bytes> <month> <day> <time> <name>"
          # — we only need the filename and the size column. ($5 is size in
          # bytes on GNU and BSD ls; $NF is filename.)
          if [ -f "dist/branchdam-mobile-${VER}.apk" ] || [ -f "dist/branchdam-mobile-${VER}.aab" ]; then
            {
              printf 'branchdam-mobile %s\n' "${VER}"
              printf '%s\n' "--------------------------------"
              ( cd dist && ls -l "branchdam-mobile-${VER}.apk" "branchdam-mobile-${VER}.aab" 2>/dev/null \
                | awk '{printf "%-44s  %10d bytes\n", $NF, $5}' )
              printf '\n'
            } > "dist/branchdam-mobile-${VER}.manifest.txt"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branchdam-mobile-release-binaries
          path: dist/*
          if-no-files-found: warn

      - name: Attach Binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.release-tag }}
        run: |
          if [ -n "$TAG_NAME" ] && [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            echo "Uploading artifacts to release $TAG_NAME..."
            gh release upload "$TAG_NAME" dist/* --clobber -R "${{ github.repository }}"
          else
            echo "No release tag target specified or no artifacts found; skipping release attachment."
          fi

  build-release-ios-framework:
    name: Build Release iOS Framework
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Build branchdam.xcframework
        run: ./scripts/build-mobile.sh --ios-only

      - name: Package Framework and Checksum
        run: |
          mkdir -p dist

          # Zip the built xcframework preserving symlinks
          ( cd ios/Frameworks && ditto -c -k --keepParent branchdam.xcframework "../../dist/branchdam.xcframework.zip" )

          # Generate SHA256 sidecar file
          ( cd dist && shasum -a 256 "branchdam.xcframework.zip" > "branchdam.xcframework.zip.sha256" )

      - name: Upload iOS Framework Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branchdam-xcframework-release-binary
          path: dist/*
          if-no-files-found: warn

      - name: Attach iOS Framework to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.release-tag }}
        run: |
          if [ -n "$TAG_NAME" ] && [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            echo "Uploading iOS framework artifact to release $TAG_NAME..."
            gh release upload "$TAG_NAME" dist/* --clobber -R "${{ github.repository }}"
          else
            echo "No release tag target specified or no artifacts found; skipping release attachment."
          fi
