version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # codeql-action/init and codeql-action/analyze must move in the same
    # commit. Separate PRs fail CI with a version-mismatch configuration error.
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      # applies-to defaults to version-updates, so a GHSA bump would still
      # open one PR per sub-action and could land init and analyze apart.
      codeql-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"

  # The Android/Gradle dependency graph: AndroidX, CameraX, Media3, Coil,
  # ML Kit and the build plugins. Without this the whole Android surface is
  # unmonitored -- no advisory ever reaches it.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    # The Compose compiler plugin version has to match the Kotlin Gradle
    # plugin. Bumping only one of them fails script compilation.
    groups:
      kotlin:
        patterns:
          # Colon form is the Maven coordinate (org.jetbrains.kotlin:kotlin-stdlib).
          # It does not match org.jetbrains.kotlinx, so coroutines stays out.
          # The other two are Gradle plugin ids, which have no group:artifact colon.
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.android*"
          - "org.jetbrains.kotlin.plugin*"

  # Root and core are two modules sharing one dependency graph (root requires
  # core via replace). A bump that lands in only one of them fails CI on the
  # other with "go: updates to go.mod needed" (#260), so group-by
  # dependency-name folds both directories into a single PR per dependency.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/core"
    schedule:
      interval: "weekly"
    # group-by applies to version updates only. A security update still opens
    # one PR per directory (applies-to: security-updates groups within a
    # directory, never across them), so a GHSA bump can still need a
    # `go mod tidy` in the other module; the go-mod-tidy hooks flag it.
    groups:
      go-modules:
        group-by: dependency-name
        patterns:
          - "*"
