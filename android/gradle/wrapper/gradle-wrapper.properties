distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
# Pin the distribution's checksum: validateDistributionUrl=true only checks
# that the URL is well-formed, so without this the Gradle distribution --
# the first code to run in every build, with access to the release keystore
# secrets -- is fetched over the network and executed unverified.
distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
