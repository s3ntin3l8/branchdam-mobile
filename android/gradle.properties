org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Suppresses AGP version mismatch check during JDK 25 migration
android.overrideVersionCheck=true

# AGP 9 turns on the new DSL and built-in Kotlin. This module still uses the
# AGP 8 android {} surface (testOptions, buildFeatures) and an explicit Kotlin
# Gradle plugin so org.jetbrains.kotlin.plugin.compose stays the same version
# as org.jetbrains.kotlin.android. Both opt-outs are removed in AGP 10.
android.newDsl=false
android.builtInKotlin=false
