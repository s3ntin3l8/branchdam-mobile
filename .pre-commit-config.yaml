# Blueprint: Mobile App Multiplatform Pre-commit Config
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt (core)
        entry: bash -c 'cd core && test -z "$(gofmt -l $(git ls-files "*.go"))"'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: go vet (core)
        entry: bash -c 'cd core && go vet ./...'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy check (core)
        entry: bash -c 'cd core && go mod tidy -diff && git diff --exit-code go.mod go.sum'
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]
